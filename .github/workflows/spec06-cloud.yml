name: SPEC-06 cloud verification
on:
  push:
    branches: [feature/guardian-cloud-monitor]
permissions:
  contents: write
jobs:
  verify:
    timeout-minutes: 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format changed sources
        run: |
          npx prettier --write tests/unit/gatekeeper.test.ts src/domain/cloud-observer.ts src/services/cloud-observer-service.ts src/app/api/guardian/cloud-feed/route.ts src/components/guardian/guardian-cloud-panel.tsx src/components/guardian/guardian-console.tsx src/app/guardian.css tests/unit/cloud-observer.test.ts
          git add tests/unit/gatekeeper.test.ts src/domain/cloud-observer.ts src/services/cloud-observer-service.ts src/app/api/guardian/cloud-feed/route.ts src/components/guardian/guardian-cloud-panel.tsx src/components/guardian/guardian-console.tsx src/app/guardian.css tests/unit/cloud-observer.test.ts
          if ! git diff --cached --quiet; then
            git config user.name "SaveState CI"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: format SPEC-06 sources with Prettier"
            git push origin HEAD:feature/guardian-cloud-monitor
          fi
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npm run build
