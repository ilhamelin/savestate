name: SPEC-03 cloud preflight
on:
  push:
    branches: [feature/virtual-3d-memory-card]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Production build
        run: npm run build
      - name: Browser and bundle acceptance tools (runner only)
        run: |
          npm install --no-save --package-lock=false playwright esbuild
          npx playwright install --with-deps chromium
      - name: Browser acceptance
        id: browser
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/spec03-browser.mjs" <<'JS'
          import { chromium } from 'playwright';
          import { build } from 'esbuild';
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs';
          import { createServer } from 'node:http';
          import assert from 'node:assert/strict';
          const temp = process.env.RUNNER_TEMP;
          writeFileSync(temp + '/spec03-image.tsx', 'import React from "react"; export default function Image({unoptimized, ...props}){return <img {...props}/>;}');
          await build({
            stdin: { contents: `
              import React from 'react';
              import {createRoot} from 'react-dom/client';
              import {RetroCard3D} from './src/components/retro-card-3d';
              createRoot(document.getElementById('app')).render(
                <RetroCard3D username="player_with_a_long_username_123" avatarUrl={null} clearRate={75.5} hours={1234.5}
                  terminalStatus="Ready for the next checkpoint and a new adventure"
                  topGames={[1,2,3,4].map(id=>({id:String(id),title:'Favorite game '+id,coverUrl:null}))}
                  qrCode={{url:'https://savestate-eight.vercel.app/players/player',size:29,path:'M4,4.5h7'}}>
                  {skin=><button id="export">Export {skin}</button>}
                </RetroCard3D>);
            `, resolveDir: process.cwd(), loader: 'tsx' },
            nodePaths: [process.cwd() + '/node_modules'],
          bundle: true, write: true, outfile: temp + '/spec03-fixture.js', jsx: 'automatic',
            alias: { 'next/image': temp + '/spec03-image.tsx', '@': process.cwd() + '/src' },
            define: { 'process.env.NODE_ENV': '"production"' },
          });
          const css = readdirSync('.next/static/chunks').filter(p=>p.endsWith('.css')).map(p=>readFileSync('.next/static/chunks/'+p,'utf8')).join('\n');
          const html = '<!doctype html><meta name="viewport" content="width=device-width, initial-scale=1"><style>'+css+'</style><main style="max-width:680px;width:calc(100% - 32px);margin:20px auto;padding:16px" class="panel"><div id="app"></div></main><script src="/fixture.js"></script>';
          const server = createServer((req,res)=>{
            res.setHeader('Content-Type', req.url === '/fixture.js' ? 'text/javascript' : 'text/html');
            res.end(req.url === '/fixture.js' ? readFileSync(temp+'/spec03-fixture.js') : html);
          });
          await new Promise(resolve=>server.listen(4173,'127.0.0.1',resolve));
          const browser = await chromium.launch({headless:true});
          try {
           const page = await browser.newPage();
           const errors=[];page.on('pageerror',e=>errors.push(e.message));
           await page.goto('http://127.0.0.1:4173');
           await page.locator('.retro-card-controls select').waitFor();
           for (const width of [320,375,768,1200]) {
            await page.setViewportSize({width,height:900});
            for(const skin of ['ps1_memory_card','gameboy_cartridge','atomic_purple']){
             await page.locator('select').selectOption(skin);
             const geometry=await page.evaluate(()=>{
              const front=document.querySelector('.retro-card-front').getBoundingClientRect();
              const sticker=document.querySelector('.retro-card-sticker').getBoundingClientRect();
              const blocks=document.querySelector('.retro-card-blocks').getBoundingClientRect();
              return {fits:sticker.bottom<=front.bottom && blocks.bottom<=front.bottom,overflow:document.documentElement.scrollWidth>innerWidth};
             });
             assert.equal(geometry.overflow,false,'horizontal overflow '+width+' '+skin);
             assert.equal(geometry.fits,true,'front content overflow '+width+' '+skin);
             assert.equal(await page.locator('#export').textContent(),'Export '+skin);
            }
           }
           const flip=page.getByRole('button',{name:'Girar Tarjeta'});
           await flip.focus();await page.keyboard.press('Space');
           assert.equal(await page.getByRole('button',{name:'Ver cara frontal'}).getAttribute('aria-pressed'),'true');
           assert.equal(await page.locator('.retro-card-front').getAttribute('inert'),'');
           await page.getByRole('button',{name:'Ver cara frontal'}).click();
           await page.mouse.move(1,1);
           const box=await page.locator('.retro-card-scene').boundingBox();
           await page.mouse.move(box.x+box.width*.8,box.y+box.height*.2);
           await page.waitForFunction(()=>document.querySelector('.retro-card-tilt').style.getPropertyValue('--card-rx')!=='0deg' && document.querySelector('.retro-card-tilt').style.getPropertyValue('--card-rx')!=='');
           await page.emulateMedia({reducedMotion:'reduce'});
           await page.waitForFunction(()=>getComputedStyle(document.querySelector('.retro-card-tilt')).transform==='none');
           assert.equal(await page.locator('.retro-card-object').evaluate(el=>getComputedStyle(el).transitionDuration),'0s');
           await page.getByRole('button',{name:'Girar Tarjeta'}).click();
           assert.equal(await page.locator('.retro-card-front').evaluate(el=>getComputedStyle(el).visibility),'hidden');
           assert.equal(await page.locator('.retro-card-back').evaluate(el=>getComputedStyle(el).visibility),'visible');
           await page.getByRole('link',{name:'Abrir perfil de @player_with_a_long_username_123'}).focus();
           assert.equal(await page.locator('.retro-card-qr').evaluate(el=>document.activeElement===el),true);
           assert.deepEqual(errors,[]);
           console.log('SPEC03_BROWSER_OK: 12 mobile/desktop chassis layouts; keyboard flip, inert face, dynamic reduced motion, focusable QR; no runtime errors');
          } finally { await browser.close(); await new Promise(resolve=>server.close(resolve)); }
          
          JS
          cp "$RUNNER_TEMP/spec03-browser.mjs" ./spec03-browser.mjs
          node ./spec03-browser.mjs
          rm ./spec03-browser.mjs
      - name: Build unchanged baseline for deterministic bundle comparison
        run: |
          git fetch origin 44b2dd221e83bf2aa1bec45185ab3d7d8c566c3a
          git worktree add "$RUNNER_TEMP/spec03-base" 44b2dd221e83bf2aa1bec45185ab3d7d8c566c3a
          npm ci --prefix "$RUNNER_TEMP/spec03-base"
          cd "$RUNNER_TEMP/spec03-base"
          npm run build
      - name: Verify profile initial JS plus CSS gzip budget
        env:
          BASE_BUILD: ${{ runner.temp }}/spec03-base
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, existsSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';
          import { runInNewContext } from 'node:vm';
          import { gzipSync } from 'node:zlib';
          function size(root) {
            const context = {};
            runInNewContext(readFileSync(join(root, '.next/server/app/players/[username]/page_client-reference-manifest.js'), 'utf8'), context);
            const manifest = Object.values(context.__RSC_MANIFEST)[0];
            const paths = new Set();
            for (const module of Object.values(manifest.clientModules))
              for (const chunk of module.chunks ?? [])
                if (typeof chunk === 'string' && chunk.endsWith('.js')) paths.add(chunk.replace(/^\/?_next\//, ''));
            for (const entries of Object.values(manifest.entryCSSFiles))
              for (const entry of entries) {
                const path = typeof entry === 'string' ? entry : entry.path;
                if (path) paths.add(path.replace(/^\/?_next\//, ''));
              }
            let js = 0, css = 0;
            for (const path of paths) {
              const file = join(root, '.next', path);
              if (!existsSync(file)) throw new Error('Missing emitted chunk: ' + file);
              const length = gzipSync(readFileSync(file), { level: 9 }).length;
              if (path.endsWith('.js')) js += length; else css += length;
            }
            if (js === 0 || css === 0) throw new Error('Empty route manifest measurement');
            return { js, css, total: js + css, chunks: paths.size };
          }
          const base = size(process.env.BASE_BUILD);
          const feature = size(process.cwd());
          function allAssets(root) {
            const folder = join(root, '.next/static/chunks');
            return readdirSync(folder).filter(p => /\.(js|css)$/.test(p))
              .reduce((total, path) => total + gzipSync(readFileSync(join(folder, path)), { level: 9 }).length, 0);
          }
          const allAssetsDelta = allAssets(process.cwd()) - allAssets(process.env.BASE_BUILD);
          const delta = feature.total - base.total;
          console.log('SPEC03_BUNDLE', JSON.stringify({ base, feature, delta, allAssetsDelta, budgetBytes: 5000 }));
          if (delta >= 5000) throw new Error('Profile initial JS + CSS gzip delta must stay below 5KB');
          
          JS
      - name: Require browser acceptance
        if: steps.browser.outcome != 'success'
        run: exit 1
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Read exact dependency advisory
        run: npm audit --json || true
