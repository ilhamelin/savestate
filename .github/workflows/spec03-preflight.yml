name: SPEC-03 cloud preflight
on:
  push:
    branches: [feature/virtual-3d-memory-card]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install server QR encoder and independent test decoder
        run: |
          npm install --save-exact qrcode@1.5.4
          npm install --save-dev --save-exact @types/qrcode@1.5.6 jsqr@1.4.0
      - name: Format and save generated dependency lock
        run: |
          npx prettier --write 'src/domain/memory-card.ts' 'src/lib/memory-card-qr.ts' 'src/components/retro-card-3d.tsx' 'src/styles/retro-card-3d.css' 'src/components/memory-card-export.tsx' 'src/lib/memory-card-export.ts' 'src/app/players/[username]/page.tsx' 'src/app/globals.css' 'tests/unit/retro-card-3d.test.ts' package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/domain/memory-card.ts' 'src/lib/memory-card-qr.ts' 'src/components/retro-card-3d.tsx' 'src/styles/retro-card-3d.css' 'src/components/memory-card-export.tsx' 'src/lib/memory-card-export.ts' 'src/app/players/[username]/page.tsx' 'src/app/globals.css' 'tests/unit/retro-card-3d.test.ts' package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(SPEC-03): lock server QR dependency and format feature"
            git push origin HEAD:feature/virtual-3d-memory-card
          fi
      - run: npm run check
      - name: Production build
        run: npm run build
