name: SPEC-04 cloud verification
on:
  push:
    branches: [feature/retro-radio-deck]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format feature in the cloud
        run: |
          npx prettier --write 'src/domain/retro-audio.ts' 'src/lib/retro-audio/audio-focus.ts' 'src/lib/retro-audio/synth-chiptune.ts' 'src/lib/retro-audio/audio-engine.ts' 'src/components/retro-radio/cassette-slot.tsx' 'src/components/retro-radio/equalizer-visualizer.tsx' 'src/components/retro-radio/retro-radio-deck.tsx' 'src/styles/retro-radio.css' 'src/app/layout.tsx' 'src/components/worlds-music-player.tsx' 'tests/unit/retro-audio.test.ts'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/domain/retro-audio.ts' 'src/lib/retro-audio/audio-focus.ts' 'src/lib/retro-audio/synth-chiptune.ts' 'src/lib/retro-audio/audio-engine.ts' 'src/components/retro-radio/cassette-slot.tsx' 'src/components/retro-radio/equalizer-visualizer.tsx' 'src/components/retro-radio/retro-radio-deck.tsx' 'src/styles/retro-radio.css' 'src/app/layout.tsx' 'src/components/worlds-music-player.tsx' 'tests/unit/retro-audio.test.ts'
          if ! git diff --cached --quiet; then
            git commit -m "chore(SPEC-04): format retro radio implementation"
            git push origin HEAD:feature/retro-radio-deck
          fi
      - run: npm run check
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
