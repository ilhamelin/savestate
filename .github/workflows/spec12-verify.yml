name: SPEC-12 verification
on:
  push:
    branches: [feature/guardian-soc-threat-shield]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only-soc
          POSTGRES_DB: soc_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: fixture-only-soc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guardian-soc-threat-shield
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read installed Next.js guides
        run: |
          cat node_modules/next/dist/docs/01-app/03-api-reference/03-file-conventions/proxy.md
          cat node_modules/next/dist/docs/01-app/03-api-reference/03-file-conventions/route.md
      - name: Verify migration in disposable PostgreSQL
        run: |
          psql -h 127.0.0.1 -U postgres -d soc_test -v ON_ERROR_STOP=1 -f tests/fixtures/guardian-soc-schema.sql
          psql -h 127.0.0.1 -U postgres -d soc_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610240041_guardian_soc.sql
          psql -h 127.0.0.1 -U postgres -d soc_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610240041_guardian_soc.sql
          psql -h 127.0.0.1 -U postgres -d soc_test -v ON_ERROR_STOP=1 -f tests/integration/guardian-soc.sql
          bash tests/integration/guardian-soc-concurrency.sh
      - name: Format changed implementation
        run: |
          npx prettier --write tests/unit/guardian-routes.test.ts src/app/soc-qa/page.tsx scripts/spec12-browser.mjs src/domain/threat-shield.ts src/services/threat-shield-store.ts src/services/threat-shield-service.ts src/lib/database.types.ts src/domain/guardian-suite.ts src/services/system-state.ts src/app/api/guardian/soc/telemetry/route.ts src/app/api/guardian/soc/defcon/route.ts src/app/api/guardian/soc/quarantine/route.ts src/proxy.ts src/domain/gatekeeper.ts src/app/api/gatekeeper/verify/route.ts src/app/api/auth/password/route.ts src/components/auth-form.tsx src/components/guardian/guardian-soc-panel.tsx src/components/guardian/guardian-console.tsx src/styles/guardian-soc.css tests/unit/threat-shield.test.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests scripts/spec12-browser.mjs
            git commit -m "style: format Guardian SOC implementation"
            git push origin HEAD:feature/guardian-soc-threat-shield
          fi
      - run: npm run check
      - run: npm run build
      - name: Browser QA with isolated tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/spec12-tools" --no-save --package-lock=false playwright
          npm start > "$RUNNER_TEMP/spec12-next.log" 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/status > /dev/null; then break; fi
            sleep 1
          done
          node scripts/spec12-browser.mjs
