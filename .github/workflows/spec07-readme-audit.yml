name: SPEC-07 README audit and branch cleanup
on:
  push:
    branches: [implementation/chatgpt]
    paths: ['.github/workflows/spec07-readme-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate README links, assets and contracts
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, existsSync } from 'node:fs';
          const md = readFileSync('README.md', 'utf8');
          const paths = [...md.matchAll(/\]\(([^)]+)\)|\bsrc="([^"]+)"/g)]
            .map(m => m[1] ?? m[2]).filter(p => !/^https?:|^#/.test(p));
          for (const path of paths) assert.ok(existsSync(path), 'Broken link: ' + path);
          for (const [anchor, heading] of [
            ['#documentación', '## Documentación'],
            ['#desarrollo-en-la-nube', '## Desarrollo en la nube'],
            ['#calidad-y-verificación', '## Calidad y verificación'],
          ]) { assert.ok(md.includes('(' + anchor + ')')); assert.ok(md.includes(heading)); }
          const png = readFileSync('public/icons/icon-512.png');
          assert.equal(png.subarray(0, 8).toString('hex'), '89504e470d0a1a0a');
          assert.equal(png.readUInt32BE(16), 512);
          assert.equal(png.readUInt32BE(20), 512);
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.engines.node, '>=24.0.0');
          assert.match(pkg.dependencies.next, /^16\./);
          assert.match(pkg.dependencies.react, /19\./);
          assert.match(pkg.devDependencies.typescript, /5\./);
          assert.match(pkg.dependencies.tailwindcss, /4\./);
          for (const status of ['playing','backlog','cleared','platinum','dropped','wishlist'])
            assert.ok(readFileSync('src/domain/model.ts','utf8').includes("'" + status + "'"));
          assert.match(md, /Cloud \/ CI/);
          assert.match(md, /biblioteca offline.*sigue pendiente de integración/i);
          assert.match(md, /Los enlaces de archivos de R2 son públicos/);
          assert.ok(readFileSync('src/repositories/player.ts', 'utf8').includes('.limit(500)'));
          assert.ok(existsSync('src/services/cloud-observer-service.ts'));
          const badge = await fetch('https://github.com/ilhamelin/savestate/actions/workflows/ci.yml/badge.svg?branch=implementation%2Fchatgpt', { signal: AbortSignal.timeout(10000) });
          assert.ok(badge.ok, 'CI badge HTTP failure');
          assert.match(await badge.text(), /<svg/);
          console.log('SPEC07_AUDIT_PASS: ' + paths.length + ' relative references (' + new Set(paths).size + ' unique), 3 anchors, valid 512px PNG, CI badge SVG, runtime/stack/status/privacy/offline/Guardian contracts.');
          NODE
      - run: npm ci
      - run: npm run check
      - name: Delete merged docs branch only if its reviewed head is unchanged
        run: |
          head="$(git ls-remote origin refs/heads/docs/project-readme | cut -f1)"
          if [ -z "$head" ]; then
            echo "Reviewed branch already removed."
          elif [ "$head" = "636a619e3f0a88849b82a969a2672d947771e5cc" ]; then
            git push origin --delete docs/project-readme
          else
            echo "Branch has new work; preserving it."
            exit 1
          fi
