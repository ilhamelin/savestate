name: Temporary offline library preflight
on:
  push:
    branches: [feature/offline-library]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format and commit generated lockfile on feature branch
        run: |
          npx prettier --write 'tests/unit/offline-library-access.test.ts' 'public/offline-library/store.mjs' 'public/offline-library/store.d.mts' 'src/domain/offline-library.ts' 'src/lib/offline-library-auth.ts' 'src/components/offline-library-session-sync.tsx' 'src/lib/offline-library-shell.ts' 'src/components/offline-library-controls.tsx' 'public/library-sw.js' 'public/offline-library/style.css' 'public/offline-library/app.mjs' 'src/app/api/library/offline-access/route.ts' 'src/integrations/supabase/browser.ts' 'src/app/library/page.tsx' 'src/app/layout.tsx' 'tests/unit/system-broadcast-stream.test.ts' 'src/domain/gatekeeper.ts' 'src/proxy.ts' 'src/lib/use-network-online.ts' 'src/components/library.tsx' 'tests/unit/offline-library.test.ts' 'tests/unit/offline-library-worker.test.ts' 'tests/browser/offline-library.test.mjs' 'docs/offline-library.md' package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'tests/unit/offline-library-access.test.ts' 'public/offline-library/store.mjs' 'public/offline-library/store.d.mts' 'src/domain/offline-library.ts' 'src/lib/offline-library-auth.ts' 'src/components/offline-library-session-sync.tsx' 'src/lib/offline-library-shell.ts' 'src/components/offline-library-controls.tsx' 'public/library-sw.js' 'public/offline-library/index.html' 'public/offline-library/style.css' 'public/offline-library/app.mjs' 'src/app/api/library/offline-access/route.ts' 'src/integrations/supabase/browser.ts' 'src/app/library/page.tsx' 'src/app/layout.tsx' 'tests/unit/system-broadcast-stream.test.ts' 'src/domain/gatekeeper.ts' 'src/proxy.ts' 'src/lib/use-network-online.ts' 'src/components/library.tsx' 'tests/unit/offline-library.test.ts' 'tests/unit/offline-library-worker.test.ts' 'tests/browser/offline-library.test.mjs' 'docs/offline-library.md' package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore: format offline library and lock test dependencies"
          git push origin HEAD:feature/offline-library
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/browser/offline-library.test.mjs
