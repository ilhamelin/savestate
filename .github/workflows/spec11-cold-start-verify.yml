name: SPEC-11 cold start verification
on:
  push:
    branches: [fix/dependency-monitor-cold-start]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dependency-monitor-cold-start
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format fix
        run: |
          npx prettier --write 'src/services/dependency-monitor-service.ts' 'src/integrations/igdb/server.ts' 'tests/unit/dependency-monitor.test.ts' 'docs/dependency-monitor.md' 'tests/unit/igdb-probe-token.test.ts'
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add 'src/services/dependency-monitor-service.ts' 'src/integrations/igdb/server.ts' 'tests/unit/dependency-monitor.test.ts' 'docs/dependency-monitor.md' 'tests/unit/igdb-probe-token.test.ts'
            git commit -m "style: format cold-start dependency probe"
            git push origin HEAD:fix/dependency-monitor-cold-start
          fi
      - run: npm run check
      - run: npm run build
