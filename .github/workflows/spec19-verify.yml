name: SPEC-19 verification
on:
  push:
    branches: [fix/game-detail-rsc-resilience]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/game-detail-rsc-resilience
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format feature files
        run: |
          npx prettier --write 'src/domain/game-detail-resilience.ts' 'src/components/game-meta-hub.tsx' 'src/components/game-critic-and-specs.tsx' 'src/services/game-achievements-service.ts' 'src/components/game-achievements.tsx' 'src/components/achievement-icon.tsx' 'src/components/resilient-widget-boundary.tsx' 'src/components/resilient-server-widget.tsx' 'src/app/games/[slug]/error.tsx' 'src/app/games/[slug]/page.tsx' 'tests/unit/game-detail-resilience.test.ts'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'src/domain/game-detail-resilience.ts' 'src/components/game-meta-hub.tsx' 'src/components/game-critic-and-specs.tsx' 'src/services/game-achievements-service.ts' 'src/components/game-achievements.tsx' 'src/components/achievement-icon.tsx' 'src/components/resilient-widget-boundary.tsx' 'src/components/resilient-server-widget.tsx' 'src/app/games/[slug]/error.tsx' 'src/app/games/[slug]/page.tsx' 'tests/unit/game-detail-resilience.test.ts'
          if ! git diff --cached --quiet; then git commit -m "style: format game detail resilience"; git push; fi
      - run: npm test
      - run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=1536
      - run: npm run lint -- --max-warnings=0
        env:
          NODE_OPTIONS: --max-old-space-size=1536
      - run: npm run format:check
      - run: npx next build --webpack
