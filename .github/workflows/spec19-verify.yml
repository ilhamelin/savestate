name: SPEC-19 verification
on:
  push:
    branches: [fix/game-detail-rsc-resilience]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/game-detail-rsc-resilience
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format segment heading
        run: |
          npx prettier --write 'src/app/games/[slug]/error.tsx'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'src/app/games/[slug]/error.tsx'
          if ! git diff --cached --quiet; then git commit -m "style: format segment recovery heading"; git push; fi
      - run: npx next build --webpack
