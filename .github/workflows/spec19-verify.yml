name: SPEC-19 verification
on:
  push:
    branches: [fix/game-detail-rsc-resilience]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/game-detail-rsc-resilience
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format feature files
        run: |
          npx prettier --write 'src/domain/game-detail-resilience.ts' 'src/components/game-meta-hub.tsx' 'src/components/game-critic-and-specs.tsx' 'src/services/game-achievements-service.ts' 'src/components/game-achievements.tsx' 'src/components/achievement-icon.tsx' 'src/components/resilient-widget-boundary.tsx' 'src/components/resilient-server-widget.tsx' 'src/app/games/[slug]/error.tsx' 'src/app/games/[slug]/page.tsx' 'tests/unit/game-detail-resilience.test.ts' 'src/app/games/[slug]/resilience-qa/page.tsx' 'src/components/game-detail-qa-client.tsx'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'src/domain/game-detail-resilience.ts' 'src/components/game-meta-hub.tsx' 'src/components/game-critic-and-specs.tsx' 'src/services/game-achievements-service.ts' 'src/components/game-achievements.tsx' 'src/components/achievement-icon.tsx' 'src/components/resilient-widget-boundary.tsx' 'src/components/resilient-server-widget.tsx' 'src/app/games/[slug]/error.tsx' 'src/app/games/[slug]/page.tsx' 'tests/unit/game-detail-resilience.test.ts' 'src/app/games/[slug]/resilience-qa/page.tsx' 'src/components/game-detail-qa-client.tsx'
          if ! git diff --cached --quiet; then git commit -m "style: format game detail resilience"; git push; fi
      - run: npm test
      - run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=1536
      - run: npm run lint -- --max-warnings=0
        env:
          NODE_OPTIONS: --max-old-space-size=1536
      - run: npm run format:check
      - run: npx next build --webpack
      - name: Install isolated browser tooling
        run: npm install --prefix "$RUNNER_TEMP/spec19-tools" --no-save --package-lock=false playwright
      - name: Verify real RSC streaming, segment recovery and image hydration
        run: |
          npm run start > "$RUNNER_TEMP/spec19-next.log" 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:3000/explore > /dev/null; then break; fi
            sleep 1
          done
          node .github/spec19-browser.mjs
      - name: Show diagnostic server log on failure
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/spec19-next.log" || true
