name: SPEC-08 remote acceptance
on:
  push:
    branches: [feature/arcade-lfg-hub]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format SPEC-08 changes
        run: |
          npx prettier --write src/domain/arcade.ts src/services/arcade.ts src/app/api/parties/route.ts src/app/arcade/page.tsx src/app/parties/page.tsx src/components/header-nav.tsx src/components/command-menu.tsx src/components/party-board.tsx src/components/arcade/party-board.tsx src/components/arcade/party-modal.tsx src/app/arcade.css tests/unit/arcade-parties-api.test.ts docs/arcade-lfg-spec08.md
          git add src/domain/arcade.ts src/services/arcade.ts src/app/api/parties/route.ts src/app/arcade/page.tsx src/app/parties/page.tsx src/components/header-nav.tsx src/components/command-menu.tsx src/components/party-board.tsx src/components/arcade/party-board.tsx src/components/arcade/party-modal.tsx src/app/arcade.css tests/unit/arcade-parties-api.test.ts docs/arcade-lfg-spec08.md
          if ! git diff --cached --quiet; then
            git config user.name "SaveState CI"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: format SPEC-08 sources"
            git push origin HEAD:feature/arcade-lfg-hub
          fi
      - run: npm run check
      - run: npm run build
      - name: Install browser acceptance tools on runner only
        run: |
          npm install --no-save --package-lock=false playwright esbuild
          if ! command -v google-chrome; then npx playwright install chromium; fi
      - run: node .github/spec08-browser.mjs
