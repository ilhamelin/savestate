name: SPEC-16 verification
on:
  push:
    branches: [feature/game-meta-intelligence]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/game-meta-intelligence
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install isolated browser tooling
        run: npm install --prefix "$RUNNER_TEMP/spec16-tools" --no-save --package-lock=false playwright
      - name: Verify responsive panel and streaming
        run: |
          npm run start > "$RUNNER_TEMP/spec16-next.log" 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:3000/explore > /dev/null; then break; fi
            sleep 1
          done
          node .github/spec16-browser.mjs
