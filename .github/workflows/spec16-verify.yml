name: SPEC-16 verification
on:
  push:
    branches: [feature/game-meta-intelligence]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/game-meta-intelligence
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format feature files
        run: |
          npx prettier --write 'src/domain/game-meta.ts' 'src/services/game-meta-service.ts' 'src/components/game-meta-hub.tsx' 'src/styles/game-meta-hub.css' 'src/app/games/[slug]/page.tsx' 'tests/unit/game-meta.test.ts'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'src/domain/game-meta.ts' 'src/services/game-meta-service.ts' 'src/components/game-meta-hub.tsx' 'src/styles/game-meta-hub.css' 'src/app/games/[slug]/page.tsx' 'tests/unit/game-meta.test.ts'
          if ! git diff --cached --quiet; then git commit -m "style: format game meta intelligence"; git push; fi
      - run: npm test
      - run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=1536
      - run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=1536
      - run: npm run format:check
      - run: npm run build
