name: SPEC-16 verification
on:
  push:
    branches: [feature/game-meta-intelligence]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/game-meta-intelligence
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read installed Next guides
        run: |
          find node_modules/next/dist/docs -iname '*unstable-cache*' -o -iname '*loading*' -o -iname '*server-components*'
          cat node_modules/next/dist/docs/01-app/03-api-reference/04-functions/unstable_cache.md
          cat node_modules/next/dist/docs/01-app/03-api-reference/03-file-conventions/loading.md
