name: SPEC-14 verification
on:
  push:
    branches: [feature/la-taberna-community-fusion]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/la-taberna-community-fusion
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read installed Next routing guides
        run: |
          find node_modules/next/dist/docs/01-app -name '*redirect*' -type f -print -exec cat {} \;
          cat node_modules/next/dist/docs/01-app/03-api-reference/03-file-conventions/page.md
      - name: Inspect canonical-link and CSS references
        run: |
          git grep -n -E '/highlights|/forum\?|href="/forum"|revalidatePath' -- src tests/unit || true
          git grep -n -E 'forum.css|highlights.css' -- src/app/globals.css
      - name: Format SPEC-14 files
        run: |
          npx prettier --write tests/unit/release-v3.test.ts 'tests/unit/tavern-publishing.test.ts' 'tests/unit/chat-navigation.test.ts' 'src/components/feed-activity-card.tsx' 'src/components/game-forum.tsx' 'src/components/highlights/post-actions.tsx' 'src/domain/lol-analytics.ts' 'tests/unit/lol-analytics.test.ts' 'src/app/sitemap.ts' 'src/components/command-menu.tsx' scripts/spec14-browser.mjs 'src/domain/tavern.ts' 'src/app/tavern/page.tsx' 'src/app/forum/page.tsx' 'src/app/highlights/page.tsx' 'src/app/arcade/page.tsx' 'src/app/parties/page.tsx' 'next.config.ts' 'src/components/header-nav.tsx' 'src/components/command-menu.tsx' 'src/app/players/[username]/page.tsx' 'src/components/wrapped-view.tsx' 'src/app/layout.tsx' 'src/components/arcade/party-board.tsx' 'src/components/forum-create.tsx' 'src/app/forum/[category]/page.tsx' 'src/services/forum.ts' 'src/services/highlights.ts' 'tests/unit/tavern-hub.test.ts' 'tests/unit/arcade-parties-api.test.ts' 'tests/unit/tavern-publishing.test.ts'
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests next.config.ts scripts/spec14-browser.mjs
            git commit -m "style: format SPEC-14 community fusion"
            git push origin HEAD:feature/la-taberna-community-fusion
          fi
      - run: npm test
      - run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=1536
      - run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=1536
      - run: npm run format:check
      - run: npm run build
      - name: Browser compatibility checks
        run: |
          npm install --prefix "$RUNNER_TEMP/spec14-tools" --no-save --package-lock=false playwright
          npm start > "$RUNNER_TEMP/spec14-next.log" 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/status > /dev/null; then break; fi
            sleep 1
          done
          node scripts/spec14-browser.mjs
