name: Temporary remote engineering preflight
on:
  push:
    branches: [feature/nonblocking-broadcast-polling]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format implementation with repository Prettier
        run: |
          npx prettier --write src/app/layout.tsx src/components/system-broadcast-stream.tsx src/components/system-broadcast-banner.tsx src/lib/system-status-polling.ts tests/unit/system-status-polling.test.ts tests/unit/system-broadcast-stream.test.ts
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const paths = [
            'src/app/layout.tsx',
            'src/components/system-broadcast-stream.tsx',
            'src/components/system-broadcast-banner.tsx',
            'src/lib/system-status-polling.ts',
            'tests/unit/system-status-polling.test.ts',
            'tests/unit/system-broadcast-stream.test.ts',
          ];
          console.log('FORMATTED_FILES ' + JSON.stringify(paths.map(path => ({path, content: readFileSync(path, 'utf8')}))));
          NODE
      - run: npm run check
